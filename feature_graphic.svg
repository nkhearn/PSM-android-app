  <rect x="670" y="175" width="40" height="15" rx="5" fill="#4CAF50" />
  <path d="M660 250 L720 250 M690 220 L690 280" stroke="white" stroke-width="8" stroke-linecap="round" />

  <!-- Home -->
  <path d="M860 250 L930 190 L1000 250 V320 H860 V250" fill="#9C27B0" />
  <rect x="910" y="270" width="40" height="50" fill="white" />

  <!-- Text -->
