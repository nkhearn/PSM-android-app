<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="1024" height="500" fill="#F5F5F5"/>

  <!-- Sun -->
  <circle cx="200" cy="250" r="60" fill="#FFD700" />
  <g stroke="#FFD700" stroke-width="8" stroke-linecap="round">
    <line x1="200" y1="160" x2="200" y2="130" />
    <line x1="200" y1="340" x2="200" y2="370" />
    <line x1="110" y1="250" x2="80" y2="250" />
    <line x1="290" y1="250" x2="320" y2="250" />
    <line x1="136.4" y1="186.4" x2="115.2" y2="165.2" />
    <line x1="263.6" y1="313.6" x2="284.8" y2="334.8" />
    <line x1="136.4" y1="313.6" x2="115.2" y2="334.8" />
    <line x1="263.6" y1="186.4" x2="284.8" y2="165.2" />
  </g>

  <!-- Connection lines -->
  <path d="M280 250 L380 250" stroke="#BDBDBD" stroke-width="4" stroke-dasharray="10 10" fill="none" />
  <path d="M520 250 L620 250" stroke="#BDBDBD" stroke-width="4" stroke-dasharray="10 10" fill="none" />
  <path d="M760 250 L860 250" stroke="#BDBDBD" stroke-width="4" stroke-dasharray="10 10" fill="none" />

  <!-- Solar Panel -->
  <rect x="380" y="200" width="140" height="100" rx="10" fill="#2196F3" />
